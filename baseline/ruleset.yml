# The repo ruleset the factory owns. Other rulesets are never touched.
name: factory-main
enforcement: active
# No bypass actors: nobody, the owner included, merges past this ruleset. A review
# bot's outstanding changes-requested is cleared by fixing the finding or
# dismissing the review, not by bypassing the gate. gh-factory reports any bypass
# actor added by hand as drift (adamsuk/software-factory#323).
bypass_actors: []
# Applies to the default branch, whatever it is called.
include:
  - "~DEFAULT_BRANCH"
pull_request:
  dismiss_stale_reviews_on_push: false
  # A code owner must approve changes to owned paths. A repo can turn this off with
  # `require_code_owner_review: false` in its .github/factory.yml.
  require_code_owner_review: true
  # The most recent reviewable push must be approved by someone other than its pusher.
  require_last_push_approval: true
  required_review_thread_resolution: false
  allowed_merge_methods:
    - squash
# Required approvals (1 by default) and status checks come from factory.yml defaults
# and the repo's own .github/factory.yml.
# Strict: the branch must be up to date with the default branch before merging.
strict_required_status_checks_policy: true
block_force_push: true
block_deletion: true
