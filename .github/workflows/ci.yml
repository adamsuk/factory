name: CI

on:
  merge_group:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # Hosts from this job's Harden-Runner audit-mode log (adamsuk/software-factory#305).
          # One list for both matrix legs: 3.10 also fetched its interpreter (api.github.com, release-assets).
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check --output-format github .
      - run: ruff format --check .
      - run: pytest -q

  extension:
    name: Extension runs with bare python3
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # Hosts from this job's Harden-Runner audit-mode log (adamsuk/software-factory#305).
          egress-policy: block
          allowed-endpoints: >
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Entrypoint is executable and needs no pip installs
        run: |
          test -x gh-factory
          python3 -m venv /tmp/bare
          /tmp/bare/bin/python ./gh-factory --help
          for c in plan apply enrol leave; do /tmp/bare/bin/python ./gh-factory "$c" --help > /dev/null; done
      - name: Install as a gh extension from this checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install .
          gh factory --help

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # Hosts from this job's Harden-Runner audit-mode log (adamsuk/software-factory#305).
          # actionlint's installer comes from raw.githubusercontent.com and its release asset.
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/*.yml
