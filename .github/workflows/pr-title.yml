name: PR title

# Fails a pull request whose title is not a Conventional Commit, because the squash-merge commit
# takes the PR title and release.yml reads it to pick the next version.
# Generic and reusable: other repos call it with
#   jobs:
#     pr-title:
#       uses: adamsuk/gh-factory/.github/workflows/pr-title.yml@<commit-sha> # vX.Y.Z
# and may pass `types`. It also checks this repo's own PRs.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_call:
    inputs:
      types:
        description: Space-separated allowed types
        type: string
        default: feat fix perf refactor docs test ci chore build style revert

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # The audit-mode log for this job shows no outbound destination at all, so nothing is
          # allowed (adamsuk/software-factory#305). Add a host here only from a log that shows it.
          egress-policy: block
          allowed-endpoints: ""
      - name: Check the PR title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
          TYPES: ${{ inputs.types || 'feat fix perf refactor docs test ci chore build style revert' }}
        run: |
          if [ -z "$TITLE" ]; then
            echo "Not a pull request; nothing to check."
            exit 0
          fi
          alt=$(echo "$TYPES" | tr -s ' ' '|')
          if printf '%s\n' "$TITLE" | grep -Eq "^(${alt})(\([A-Za-z0-9._/-]+\))?!?: [^ ]"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must look like 'type(scope)!: summary' with type one of: $TYPES. Use feat for a feature (minor release), fix or perf for a fix (patch), '!' for a breaking change (major)."
            exit 1
          fi
